<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Status Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { background-color: #0f172a; }
        .status-badge {
            font-size: 0.75rem;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-weight: 600;
        }
        .project-card {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .project-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        }
        .progress-bar {
            height: 6px;
            background-color: #334155;
            border-radius: 9999px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background-color: #3b82f6;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body class="text-slate-200">
    <div class="max-w-7xl mx-auto px-6 py-8">
        <!-- Header -->
        <div class="flex justify-between items-end mb-8">
            <div>
                <h1 class="text-4xl font-bold tracking-tight">Project Status</h1>
                <p class="text-slate-400 mt-1">Shared dashboard for active and planned projects</p>
            </div>
            <div class="text-right">
                <div class="text-sm text-slate-400">Last updated</div>
                <div class="font-medium" id="last-updated"></div>
            </div>
        </div>

        <!-- Projects Grid -->
        <div id="projects-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Populated by JavaScript -->
        </div>

        <div class="mt-12 text-center text-sm text-slate-500">
            <p>Shared project dashboard • Hosted on GitHub Pages</p>
        </div>
    </div>

    <script>
        const statusColors = {
            "Active": "bg-emerald-500/10 text-emerald-400",
            "Exploration": "bg-amber-500/10 text-amber-400",
            "New": "bg-blue-500/10 text-blue-400",
            "Paused": "bg-slate-500/10 text-slate-400",
            "Completed": "bg-purple-500/10 text-purple-400"
        };

        function updateLastUpdated() {
            const dateEl = document.getElementById('last-updated');
            if (!dateEl) return;

            const now = new Date();
            const dateStr = now.toLocaleDateString('en-US', { 
                month: 'long', 
                day: 'numeric', 
                year: 'numeric' 
            });
            const timeStr = now.toLocaleTimeString('en-US', { 
                hour: 'numeric', 
                minute: '2-digit',
                hour12: true 
            });
            
            dateEl.textContent = `${dateStr} at ${timeStr}`;
        }

        async function loadProjects() {
            try {
                const response = await fetch('projects.json');
                const projects = await response.json();
                
                const grid = document.getElementById('projects-grid');
                grid.innerHTML = '';

                projects.forEach(project => {
                    const card = createProjectCard(project);
                    grid.appendChild(card);
                });

                // Initial date/time update
                updateLastUpdated();
                
                // Update time every minute
                setInterval(updateLastUpdated, 60000);
                
            } catch (error) {
                console.error('Failed to load projects:', error);
            }
        }

        function createProjectCard(project) {
            const div = document.createElement('div');
            div.className = 'project-card bg-slate-800 border border-slate-700 rounded-2xl p-6';

            const statusClass = statusColors[project.status] || 'bg-slate-500/10 text-slate-400';
            const progress = project.progress || 0;

            let notesHTML = '';
            if (project.notes) {
                notesHTML = `
                    <div>
                        <span class="text-slate-400 text-sm">Notes</span>
                        <p class="text-sm mt-1">${project.notes}</p>
                    </div>
                `;
            }

            div.innerHTML = `
                <div class="flex justify-between items-start mb-4">
                    <div>
                        <h3 class="font-semibold text-lg">${project.name}</h3>
                        <p class="text-sm text-slate-400">${project.description}</p>
                    </div>
                    <span class="status-badge ${statusClass}">${project.status}</span>
                </div>
                
                <div class="space-y-4 text-sm">
                    <div>
                        <div class="flex justify-between mb-1.5">
                            <span class="text-slate-400">Progress</span>
                            <span class="font-medium">${progress}%</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${progress}%"></div>
                        </div>
                    </div>

                    <div class="flex justify-between">
                        <span class="text-slate-400">Current Phase</span>
                        <span class="font-medium">${project.phase}</span>
                    </div>
                    
                    <div class="flex justify-between">
                        <span class="text-slate-400">Last Updated</span>
                        <span>${new Date(project.last_updated).toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'})}</span>
                    </div>
                    
                    ${notesHTML}
                </div>

                <div class="mt-4 pt-4 border-t border-slate-700">
                    <a href="#" class="text-sm flex items-center gap-2 text-blue-400 hover:text-blue-300">
                        <i class="fa-brands fa-discord"></i>
                        <span>View Thread</span>
                    </a>
                </div>
            `;

            return div;
        }

        loadProjects();
    </script>
</body>
</html>
